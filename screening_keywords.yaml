    '
changelog:
- version: '1.0'
  date: '2026-09-15'
  change: Initial schema transcribed from design document Appendix B.
- version: '1.1'
  date: '2026-09-15'
  change: 'Appendix B pilot run on ACL 2025-2026 (3,824 records). Retention fell from 28.8% to 12.5% after four Tier 2 demotions, three narrowings, two regex boundary fixes, and a widening of the preservation set from social-choice vocabulary to NLP-native phrasing (5 hits to 26). Repeat this pilot on the first venue of each new community before the full pass.

    '
- version: '1.2'
  date: '2026-09-15'
  change: 'Scope decision recorded on tier1.alignment: retain training-method papers at the abstract stage and filter at full text. Pattern widened to cover DPO, RLAIF, reward models, human preference data and constitutional AI. Measured on the ACL 2025-2026 pilot corpus (3,824 records): retention rose from 479 (12.5%) to 600 (15.7%), with tier1 hits rising from 212 to 345. The decision deliberately moves screening burden from title/abstract to full text, so the §11 budget line for full-text screening should be revisited if other venues behave similarly.

    '
- version: '1.3'
  date: '2026-09-26'
  change: 'Reframed with design document v7.0 from aggregation for negotiation to aggregation for disagreement, with negotiation as a discussion item. Added sets.welfare (Signal Tier 1) for social welfare functions, named welfare criteria and welfare-theoretic properties, and moved leximin and Nash social welfare into it from tier1.bargaining_solutions. Widened tier2.welfare with distributive justice and sufficientarian. Retired tier1 leakage and privacy methods (see retired). Negotiation and bargaining terms unchanged. min_year moved from 2018 to 2020 to match the reduced window. Not yet measured: rerun the ACL 2025-2026 pilot to get the retention delta, fill records_matched for the two retired sets, and pilot one EC year and one humanities journal-year before the full pass, since both are new communities and EC is the main risk for the welfare set.

    '
- version: '1.4'
  date: '2026-09-27'
  change: FAccT 2025 pilot (206 records, 100% abstract coverage). Under v1.3, 28 records were retained; three directly relevant papers were missed because they describe disagreement in normative rather than technical vocabulary and name AI alignment without training-method terms. Added preservation.pluralism, preservation.suppressed_disagreement, and tier2.ai_alignment (conditional). Retention rose to 33 of 206; of the 5 added records, 3 are relevant, 1 is borderline, and 1 is not. No Tier 1 term exceeded the 60 percent irrelevance threshold on this venue. The welfare set matched nothing in FAccT 2025 and remains untested until the EC pilot. Tier 2 "collective" (16 records) and "combining" (12) are the noisiest terms; kept for now, to be reassessed after the AIES and EC pilots.
- version: 1.5-draft
  date: '2026-10-12'
  change: Precision revision from the measured corpus (84,457 records across 9 venues). See notes on each changed term.
- version: 1.6-draft
  date: '2026-10-12'
  change: 'FAccT 2021-2025 pilot (v1.5: 115 -> 65 retained). Recall fixes: alignment public-input context, annotation subjectivity, OWA, fair federated learning. Precision fixes: tier2 welfare, negotiation, delegation narrowed; "candidates" anchor removed.'
- version: 1.7-draft
  date: '2026-10-13'
  change: 'ACL 2025-26 long-paper pilot (v1.2 600 -> v1.6 149). Recall: merging phrasings, personalization/cultural alignment, debate variants. Precision: tier2 ai alignment narrowed.'
- version: '1.8'
  date: '2026-10-13'
  change: 'Cross-venue review of included and excluded records (NeurIPS, ICML, ICLR, AAAI, IJCAI, ACL family, EMNLP, TACL; 84,457 records). Recall: social-choice vocabulary, distortion, fair allocations, proportional representation, opinion representation, opinion dynamics, assemblies, multi-stakeholder, federated aggregation contributions, LLM juries and multi-agent consensus, peer-review aggregation, pluralism variants, multi-annotation, diverse human preferences. Precision: conflict resolution, within-model MoE routing, Bradley-Terry, incentives, individual rationality, tier2 crowd, pluralistic image inpainting. Self-consistency over samples of one model is out of scope (decision 2026-10-13).'
